name: C++ exports preserve operational files
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build CLI with sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            main.cpp app_console.cpp portable_cli.cpp gui_launcher.cpp csv_io.cpp \
            json_io.cpp exchange_api.cpp moneda_gestion.cpp bigint.cpp \
            vector_dinamico.cpp algoritmo_cambio.cpp -o /tmp/progvoraz-export-safe
      - name: Verify data paths are never overwritten
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 tests/test_protected_exports.py /tmp/progvoraz-export-safe
