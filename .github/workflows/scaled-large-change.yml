name: C++ scaled large-change regression with sanitizers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile scaled large-change regression under ASan/UBSan
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Wpedantic -I. \
            -fsanitize=address,undefined,leak -fno-omit-frame-pointer \
            tests/test_scaled_large_change.cpp algoritmo_cambio.cpp bigint.cpp \
            vector_dinamico.cpp -o /tmp/test-scaled-large
      - name: Check optimal, stock and nearest change above 500000
        run: |
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:abort_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          /tmp/test-scaled-large
