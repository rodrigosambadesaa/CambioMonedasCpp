name: C++ BigInt nearest one-coin regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nearest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile exact one-coin oracle with ASan, UBSan and LSan
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Wpedantic -I. \
            -fsanitize=address,undefined,leak -fno-omit-frame-pointer \
            tests/test_one_coin_bigint_near.cpp algoritmo_cambio.cpp bigint.cpp \
            vector_dinamico.cpp -o /tmp/near-onecoin
      - name: Exercise five BigInt cases
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/near-onecoin
