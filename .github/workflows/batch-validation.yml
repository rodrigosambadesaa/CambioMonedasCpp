name: C++ strict batch CSV contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  csv:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build C++ CLI with ASan and UBSan
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Wpedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            main.cpp app_console.cpp portable_cli.cpp gui_launcher.cpp \
            csv_io.cpp json_io.cpp exchange_api.cpp moneda_gestion.cpp bigint.cpp \
            vector_dinamico.cpp algoritmo_cambio.cpp \
            -fsanitize=address,undefined -o /tmp/progvoraz-batch-cpp
      - name: Check CSV validation under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python tests/test_batch_validation.py /tmp/progvoraz-batch-cpp
