name: C CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -O2 main.cpp app_console.cpp portable_cli.cpp moneda_gestion.cpp bigint.cpp vector_dinamico.cpp algoritmo_cambio.cpp -o progvoraz

      - name: Build GUI (Linux portable)
        if: runner.os == 'Linux'
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -O2 gui_portable.cpp moneda_gestion.cpp bigint.cpp vector_dinamico.cpp algoritmo_cambio.cpp -o progvoraz_gui

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -O2 main.cpp app_console.cpp portable_cli.cpp moneda_gestion.cpp bigint.cpp vector_dinamico.cpp algoritmo_cambio.cpp -o progvoraz

      - name: Swift toolchain info (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun swift --version

      - name: Build GUI (macOS Swift)
        if: runner.os == 'macOS'
        run: xcrun --sdk macosx swiftc -parse-as-library gui_macos.swift -o progvoraz_gui_swift

      - name: Build GUI (macOS portable fallback)
        if: runner.os == 'macOS'
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -O2 gui_portable.cpp moneda_gestion.cpp bigint.cpp vector_dinamico.cpp algoritmo_cambio.cpp -o progvoraz_gui_portable

      - name: Unit tests (Linux)
        if: runner.os == 'Linux'
        run: make test

      - name: HTTP loopback integration (Linux)
        if: runner.os == 'Linux'
        run: |
          ./progvoraz --server --port 19377 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 2
          test "$(curl --fail --silent http://127.0.0.1:19377/health)" = "OK"
          curl --fail --silent http://127.0.0.1:19377/export_stock_json | grep -q '"monedas"'
          printf 'mode,moneda,monto\na,euro,6\n' | curl --fail --silent --data-binary @- http://127.0.0.1:19377/batch | grep -q 'OK total='

      - name: Interactive global menu (Linux)
        if: runner.os == 'Linux'
        run: |
          printf 'resumen\neuro\nhistorial\nconvertir\nEUR\nEUR\n127\nsalir\n' | ./progvoraz > interactive.out
          grep -q 'Moneda=euro' interactive.out
          grep -q 'Origen=127 Destino=127' interactive.out

      - name: Interactive global menu (macOS)
        if: runner.os == 'macOS'
        run: |
          printf 'resumen\neuro\nhistorial\nconvertir\nEUR\nEUR\n127\nsalir\n' | ./progvoraz > interactive.out
          grep -q 'Moneda=euro' interactive.out
          grep -q 'Origen=127 Destino=127' interactive.out

      - name: Interactive coin count limit (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          printf 'a\neuro\nlimite\n=3\n6\nsalir\n' | ./progvoraz > interactive-limit.out
          grep -q 'Cambio aceptado: 6 centimos; piezas=3' interactive-limit.out

      - name: Available currencies discovery (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          printf 'a\nsalir\n' | ./progvoraz > available-currencies.out
          grep -q 'Divisas disponibles' available-currencies.out
          grep -q 'euro:' available-currencies.out

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          printf "a\neuro\n0\nsalir\n" | ./progvoraz

      - name: Smoke test GUI portable (Linux)
        if: runner.os == 'Linux'
        run: |
          printf "euro\nvolver\nsalir\n" | ./progvoraz_gui

      - name: Unit tests (macOS)
        if: runner.os == 'macOS'
        run: make test

      - name: HTTP loopback integration (macOS)
        if: runner.os == 'macOS'
        run: |
          ./progvoraz --server --port 19377 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 2
          test "$(curl --fail --silent http://127.0.0.1:19377/health)" = "OK"

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          printf "a\neuro\n0\nsalir\n" | ./progvoraz

      - name: Smoke test GUI portable (macOS)
        if: runner.os == 'macOS'
        run: |
          printf "euro\nvolver\nsalir\n" | ./progvoraz_gui_portable

      - name: Smoke launch GUI Swift (macOS)
        if: runner.os == 'macOS'
        run: |
          ./progvoraz_gui_swift >/tmp/progvoraz_gui_swift.log 2>&1 &
          GUI_PID=$!
          sleep 3
          if ! kill -0 "$GUI_PID" 2>/dev/null; then
            echo "La GUI Swift termino prematuramente."
            cat /tmp/progvoraz_gui_swift.log
            exit 1
          fi
          kill "$GUI_PID"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -O2 main.cpp app_console.cpp portable_cli.cpp moneda_gestion.cpp bigint.cpp vector_dinamico.cpp algoritmo_cambio.cpp -o progvoraz.exe -lws2_32

      - name: Build GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -O2 gui_window.cpp moneda_gestion.cpp bigint.cpp vector_dinamico.cpp algoritmo_cambio.cpp -o progvoraz_gui.exe -mwindows

      - name: Unit tests + batch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -I. tests/test_bigint_algoritmo.cpp algoritmo_cambio.cpp bigint.cpp vector_dinamico.cpp -o progvoraz_tests.exe
          .\progvoraz_tests.exe
          g++ -std=c++20 -Wall -Wextra -Wpedantic -I. tests/test_stock_tx.cpp moneda_gestion.cpp bigint.cpp vector_dinamico.cpp -o progvoraz_stock_tests.exe
          .\progvoraz_stock_tests.exe
          .\progvoraz.exe --input tests/sample_batch.csv --output batch_out.csv
          if (-not (Select-String -Path batch_out.csv -Pattern 'OK total=')) { throw 'batch sin resultados' }
          .\progvoraz.exe --export-stock-json stock_out.json
          .\progvoraz.exe --export-report report_out.txt
          $conversion = .\progvoraz.exe --convert EUR USD 100 | Out-String
          if ($conversion -notmatch 'Destino=109') { throw 'FX parity regression' }

      - name: HTTP loopback integration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $server = Start-Process -FilePath .\progvoraz.exe -ArgumentList '--server', '--port', '19377' -PassThru -NoNewWindow
          try {
            Start-Sleep -Seconds 2
            $health = Invoke-WebRequest -Uri 'http://127.0.0.1:19377/health'
            if ($health.Content -ne 'OK') { throw 'HTTP health failed' }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }

      - name: Interactive coin count limit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = @"
          a
          euro
          limite
          =3
          6
          salir
          "@ | .\progvoraz.exe | Out-String
          if ($output -notmatch 'Cambio aceptado: 6 centimos; piezas=3') {
            throw 'C++ interactive coin count limit failed'
          }

      - name: Interactive global menu (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = @"
          resumen
          euro
          historial
          convertir
          EUR
          EUR
          127
          salir
          "@ | .\progvoraz.exe | Out-String
          if ($output -notmatch 'Moneda=euro' -or
              $output -notmatch 'Origen=127 Destino=127') {
              throw 'Interactive global menu smoke failed'
          }

      - name: Native GUI launch from CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = .\progvoraz.exe --gui | Out-String
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'Interfaz GUI iniciada') {
            throw 'C++ native GUI launch failed'
          }
          Get-Process progvoraz_gui -ErrorAction SilentlyContinue |
            Stop-Process -ErrorAction SilentlyContinue

      - name: Interactive JSON results (Linux)
        if: runner.os == 'Linux'
        run: |
          printf 'a\neuro\n127\nsalir\n' | ./progvoraz --json > json-result.log
          grep -q '"resultado":' json-result.log
          grep -q '"denominacion":' json-result.log
          grep -q '"cantidad":' json-result.log

      - name: Interactive JSON results (macOS)
        if: runner.os == 'macOS'
        run: |
          printf 'a\neuro\n127\nsalir\n' | ./progvoraz --json > json-result.log
          grep -q '"resultado":' json-result.log

      - name: Interactive JSON results (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = @"
          a
          euro
          127
          salir
          "@ | .\progvoraz.exe --json | Out-String
          if ($output -notmatch '"resultado":' -or
              $output -notmatch '"denominacion":' -or
              $output -notmatch '"cantidad":') {
              throw 'Interactive JSON schema failed'
          }

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @"
          a
          euro
          0
          salir
          "@ | .\progvoraz.exe | Out-String

      - name: Smoke launch GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath .\progvoraz_gui.exe -PassThru
          Start-Sleep -Seconds 3
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            throw "La GUI de Windows termino prematuramente con codigo $($proc.ExitCode)."
          }
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id
          }
